<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>

<body>
    <header>
        <h1>Contact Us</h1>
        <p>Got any questions? Reach out to us and we will be in contact with you.</p>
        <hr>
    </header>

    <br>

    <main align="center">
            <form>
                <div>
                    <label for="fname">First Name:</label>
                    <input type="text" id="fname"
                    fname="name" required
                    placeholder="First Name">
                </div>
                <br>
                <div>
                    <label for="lname">Last Name:</label>
                    <input type="text" id="lname"
                    name="lname" required
                    placeholder="Last Name">
                </div>
                <br>
                <div>
                    <label>Gender:</label>


                    <label for="male">Male</label>
                    <input type="radio" name="gender" id="male" required>

                    <label for="female">Female</label>
                    <input type="radio" name="gender" id="female" required>

                    <label for="pnts">Prefer not to say</label>
                    <input type="radio" name="gender" id="pnts" required>
                </div>
                <br>
                <div>
                    <label for="bdate">Birthdate:</label>
                    <input type="date" id="bdate"
                    name="bdate" required>
                </div>
                <br>
                <div>
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone"
                    name="number" required
                    placeholder="(0)123-456-789">
                </div>
                <br>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email"
                    name="email" required
                    placeholder="example@gmail.com">
                </div>
                <br>
                <div>
                    <label for="branch">Branch</label>
                    <select id="branch" name="Branch">
                        <option>QSAIR</option>
                        <option>RIS</option>
                        <option>Sky Harvest</option>
                        <option>Other</option>
                    </select>
                </div>
                <br>
                <button type="reset">
                    Clear
                </button>

                <button type="submit">
                    Submit
                </button>
            </form>

        <br>

        
    </main>  

    <hr>

    <footer>
        <form>
            <caption>Log in here</caption>
            
            <div>
            <label for="signin">Username:</label>
            <input type="text" id="signin" name="signin" required>
            </div>

            <br>

            <div>
            <label for="pass">Password:</label>
            <input type="password" id="pass" name="pass" required>
            </div>

            <button type="submit">Log in</button>
        </form>
    </footer>

</body>
</html>
